name: Documentation checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test -s README.md
      - name: Check unresolved merge markers
        shell: bash
        run: '! grep -n "^<<<<<<< " README.md'
      - name: Verify local administrative policy without network
        run: python3 -m unittest discover -s tests -v
