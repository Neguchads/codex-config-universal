name: Documentation checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: test -s README.md
      - name: Check unresolved merge markers
        shell: bash
        run: '! grep -n "^<<<<<<< " README.md'
      - name: Verify local administrative policy without network
        run: python3 -m unittest discover -s tests -v
