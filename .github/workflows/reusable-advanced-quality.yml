# Shared source-only quality checks for public repositories.
# Callers pin a full commit SHA, never a mutable branch or tag.
name: Reusable advanced quality
'on':
  workflow_call:
    inputs:
      stack:
        description: "python, node or docs"
        type: string
        required: true
      node-package-manager:
        description: "npm or pnpm (Node projects only)"
        type: string
        required: false
        default: npm
      node-fuzz-file:
        description: "Vitest property-test path in caller repository"
        type: string
        required: false
        default: tests/advanced-quality.test.ts

permissions:
  contents: read

jobs:
  python-quality:
    if: ${{ inputs.stack == 'python' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install open-source property-based test runner
        run: python -m pip install 'hypothesis>=6.130,<7'
      - name: Property-based fuzzing (synthetic inputs; no game assets or GPU)
        env:
          PYTHONPATH: .:src:scripts:tools
          HYPOTHESIS_PROFILE: ci
        run: python .github/advanced/fuzz.py
      - name: Measured benchmark (informational, never a flaky performance gate)
        env:
          PYTHONPATH: .:src:scripts:tools
        run: python .github/advanced/benchmark.py
      - name: Retain machine-readable benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-python
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 14

  node-quality:
    if: ${{ inputs.stack == 'node' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pnpm only for pnpm callers
        if: ${{ inputs.node-package-manager == 'pnpm' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.4.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: ${{ inputs.node-package-manager }}
      - name: Install locked dependencies
        shell: bash
        env:
          PKG: ${{ inputs.node-package-manager }}
        run: |
          set -euo pipefail
          case "$PKG" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "Unsupported package manager" >&2; exit 1 ;;
          esac
      - name: Deterministic randomized property tests
        shell: bash
        env:
          PKG: ${{ inputs.node-package-manager }}
          FUZZ_FILE: ${{ inputs.node-fuzz-file }}
        run: |
          set -euo pipefail
          test -f "$FUZZ_FILE"
          if [[ "$PKG" == pnpm ]]; then pnpm exec vitest run "$FUZZ_FILE"
          else npm exec -- vitest run "$FUZZ_FILE"; fi
      - name: Measured benchmark (informational)
        shell: bash
        env:
          PKG: ${{ inputs.node-package-manager }}
        run: |
          set -euo pipefail
          test -f .github/advanced/benchmark.ts
          if [[ "$PKG" == pnpm ]]; then pnpm exec vite-node .github/advanced/benchmark.ts
          else npm exec -- vite-node .github/advanced/benchmark.ts; fi
      - name: Retain machine-readable benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-node
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 14

  docs-quality:
    if: ${{ inputs.stack == 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate documentation sources
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('.').rglob('*.md'))
          assert files, 'No Markdown source files'
          for path in files:
              if any(x in path.parts for x in ('.git', 'node_modules', '.venv')):
                  continue
              text = path.read_text(encoding='utf-8')
              for line in text.splitlines():
                  if line.startswith(('<<<<<<< ', '>>>>>>> ')) or line == '=======':
                      raise AssertionError(f'{path}: unresolved merge marker')
          print(f'Validated {len(files)} Markdown files')
          PY
